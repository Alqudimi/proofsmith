[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "proofsmith"
version = "0.1.0"
description = "Deterministic, replayable evidence bundles for code-change verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Abdulaziz Alqudimi" }]
keywords = ["developer-tools", "code-review", "ci", "evidence", "ai-agents", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]
dev = ["ruff>=0.6", "mypy>=1.11", "proofsmith[test]"]

[project.scripts]
proofsmith = "proofsmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proofsmith"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["proofsmith"]
